name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # 构建脚本会输出中文日志，Windows runner 默认编码不是 UTF-8
  PYTHONIOENCODING: utf-8

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: 安装 Python 依赖
        run: pip install -r desktop/requirements.txt

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # build.py 内部完成：pnpm install → core/ui/web 编译 → 拷贝产物 → PyInstaller 单文件打包
      - name: 构建单文件 exe
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: python desktop/build.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PromptOptimizerApp-${{ steps.version.outputs.value }}
          path: desktop/dist/PromptOptimizerApp.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/PromptOptimizerApp.exe
          # 允许重跑时覆盖同名资产（本地手工上传过 exe 也不会冲突）
          overwrite_files: true
          generate_release_notes: true
